<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Rename</title>
<style>
  /* A small box to rename a black hole, opened from its name tag. */
  :root { --bg: #fbfbfb; --text: #1a1a1a; --text2: #5d5d5d; --field: #fff; --stroke: rgba(0,0,0,0.12); --accent: #0078d4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #2b2b2b; --text: #fff; --text2: #c5c5c5; --field: rgba(255,255,255,0.06); --stroke: rgba(255,255,255,0.12); } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/18px "Segoe UI Variable Text", "Segoe UI", sans-serif; }
  body { box-sizing: border-box; padding: 12px 14px; border: 1px solid var(--stroke); }
  label { display: block; color: var(--text2); margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; height: 32px; padding: 0 10px; font: inherit; color: var(--text); background: var(--field);
          border: 1px solid var(--stroke); border-bottom: 2px solid var(--accent); border-radius: 4px; outline: none; }
  .hint { color: var(--text2); font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
  <label for="name">Name this black hole</label>
  <input id="name" maxlength="40" spellcheck="false">
  <div class="hint">Enter to save · Esc to cancel</div>
<script>
const q = new URLSearchParams(location.search), input = document.getElementById('name');
input.value = q.get('name') || '';
input.focus(); input.select();
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const n = input.value.trim(); if (n) window.app.send('rename', +q.get('id'), n); window.app.send('rename-close'); }
  if (e.key === 'Escape') window.app.send('rename-close');
});
</script>
</body>
</html>
