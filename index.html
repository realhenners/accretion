<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Accretion</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; }
  body.grab { cursor: grab; }
  body.dragging { cursor: grabbing; }
  .toast { position: fixed; transform: translate(-50%, 0); text-align: center; pointer-events: none; opacity: 0;
           transition: opacity 0.9s ease; color: #f4efe8; text-shadow: 0 0 12px rgba(0,0,0,0.85), 0 0 2px rgba(0,0,0,0.9);
           font: 300 28px/1.2 "Segoe UI Variable Display", "Segoe UI", sans-serif; letter-spacing: 0.02em; white-space: nowrap; }
  .toast small { display: block; font-size: 15px; opacity: 0.75; margin-top: 6px; letter-spacing: 0.04em; }
  .toast.on { opacity: 1; }
  #fx2d, #ui2d { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* Hover a hole for a moment: a small tag with how it's feeling. */
  .moodtag { position: fixed; pointer-events: none; opacity: 0; transition: opacity 0.4s ease; white-space: nowrap;
             font: 12px/16px "Segoe UI Variable Text", "Segoe UI", sans-serif; color: rgba(244,239,232,0.9);
             background: rgba(18,14,12,0.6); border-radius: 10px; padding: 3px 9px; letter-spacing: 0.02em; }
  .moodtag b { font-weight: 400; opacity: 0.8; margin: 0 5px 0 7px; }
  .moodtag .nm { font-weight: 600; }
  body.ontag .moodtag .nm { text-decoration: underline; }
  body.ontag { cursor: text; }
  .moodtag.on { opacity: 1; }
  /* Settings -> Accessibility -> Larger labels: bigger, higher-contrast text. */
  body.large .moodtag { font-size: 16px; line-height: 22px; padding: 5px 12px; color: #fff; background: rgba(0,0,0,0.88); }
  body.large .toast { font-size: 30px; text-shadow: 0 0 4px #000, 0 0 2px #000, 0 0 16px #000; }
  body.large .toast small { font-size: 19px; opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="fx2d"></canvas>
<canvas id="ui2d"></canvas>
<div class="toast" id="toast"></div>
<div class="moodtag" id="moodtag"></div>
<script>
// One of these pages runs on every monitor. One of them (the "leader") runs the physics for every black hole and
// sends the result to the others; all of them draw whatever part of the scene falls on their monitor.
// Positions are in physical screen pixels across all monitors, so a hole straddling two monitors with different
// display scaling still lines up at the seam. The same page also renders the share view and the app icon.

const MAXH = 4;          // most black holes drawn at once
const K = 600 / 28;      // px per Schwarzschild radius at mass 1, size 1, 100% scaling
const LENS = 25.2;       // lensed area radius, in Schwarzschild radii
const EVAPORATE = 3.4, BURST = 1.2, FADE = 0.9, BORN = 0.6;   // seconds; keep DEATH_MS in main.js in step
const MEAL_TIME = 2.6;   // seconds for a swallowed window to fall in
const TDE_TIME = 9;      // seconds a tidal disruption lasts
const EAT_HOLD = 1000;   // ms the hole must be held still over a window before letting go feeds it the window
// Icon mode (also the share-card portrait) renders a hole and must not talk to the app.
const api = new URLSearchParams(location.search).has('icon') ? { ...(window.app || {}), send: () => {}, on: window.app ? window.app.on : () => {} } : window.app;

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { premultipliedAlpha: true, alpha: true, antialias: false });
const floatTargets = !!gl.getExtension('EXT_color_buffer_float');
gl.getExtension('OES_texture_float_linear');

// =====================================================================================================
//  Shaders
// =====================================================================================================
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;

const SCENE_FS = `#version 300 es
precision highp float;
layout(location = 0) out vec4 outColor;    // premultiplied colour
layout(location = 1) out vec4 outBright;   // linear light, for the bloom
#define MAXH ${MAXH}
uniform int uN;
uniform vec4 uA[MAXH];   // centre x, y (device px, y up), Schwarzschild radius px (at full mass), evaporation mass 0..1
uniform vec4 uB[MAXH];   // disk inclination, roll, Hawking glow on 0..1, seconds into the final burst (-1 before)
uniform vec4 uC[MAXH];   // opacity 0..1, seconds since fed (-1), seconds since a merger (-1), base Schwarzschild radius px
uniform vec4 uD[MAXH];   // disk colour (absorption-style coefficients rgb), heat
uniform vec4 uE[MAXH];   // spin a/M, ISCO (Rs), horizon (Rs), disk thickness H/r
uniform vec4 uF[MAXH];   // disk outer radius (Rs), disk opacity, disk on, orbit speed
uniform vec4 uG[MAXH];   // seconds into a tidal disruption (-1), Einstein-ring star brightness, hunger glow, 0
uniform float uTime;
uniform vec2 uRes;            // device px of this render target
uniform float uPxScale;       // render px per screen px (share view draws a whole monitor into a smaller window)
uniform sampler2D uScreen;    // BGRA desktop capture around the holes, rows top-down, mipmapped
uniform vec2 uWinOrigin;      // this view's top-left on screen, physical px
uniform vec2 uCapOrigin;      // captured region's top-left on screen, physical px
uniform vec2 uCapSize;
uniform bool uHasScreen, uShare;
uniform vec3 uFlatBg;         // what's "behind" when there's no capture (app icon)
uniform sampler2D uMeal;      // swallowed windows falling in (premultiplied, render px): part of what's behind
uniform bool uHasMeal;
uniform vec2 uJitter;         // sub-pixel offset, different every frame (temporal anti-aliasing)
uniform vec4 uH[MAXH];        // look extras: effect bits (FX_* below), glitch forced on (previews), colour grade, Doppler colour 0..1
uniform float uStep;          // ray step scale: 1 = full quality, more = fewer, longer steps
uniform vec4 uI[MAXH];        // dreaming 0..1, disk wind strength, being groomed 0..1, film look (no beaming) 0/1
uniform vec4 uJ[MAXH];        // lined up with another hole 0..1, corona 0..1, casts a shadow 0/1, 0
uniform sampler2D uDream;     // each hole's memory of the biggest thing it ate, side by side (128x80 each, BGRA)
uniform sampler2D uWorm;      // wormhole: another monitor, seen through the shadow (BGRA, rows top-down)
uniform bool uHasWorm;
// Unlockable effects, one bit each (index.html FX keeps the same order).
#define FX_JETS 1
#define FX_DEBRIS 2
#define FX_PHOTON 4
#define FX_HAWKING 8
#define FX_COMP 16
#define FX_RIPPLES 32
#define FX_SPIRAL 128
#define FX_CLUMPY 256
#define FX_BANDED 512
#define FX_WARPED 1024
#define FX_MAGNETIC 2048
#define FX_GLITCH 4096
#define FX_WHITE 8192
#define FX_WORM 16384
#define FX_INVERT 32768
#define FX_STARS 131072
// FXMASK (prepended when compiling) is the set of effects any hole uses right now; everything else compiles away.
bool has(int i, int f){ return (FXMASK & f) != 0 && (int(uH[i].x) & f) != 0; }

const float LENS = ${LENS.toFixed(2)};
const float BG = 19.1;        // depth of the desktop "behind" the hole, in base Schwarzschild radii (sets the Einstein ring)
// Within this many M of a hole, light follows the exact Kerr equations. Far enough out that the hand-off to and from
// the weak-field formula is seamless (Boyer-Lindquist coordinates differ from flat space by ~2M/r: 5% here).
const float ZONE = 40.0;

float hash(vec3 p){ p = fract(p*0.3183099 + 0.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float noise(vec3 x){
  vec3 i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);
  return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x), mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x), f.y),
             mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x), mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x), f.y), f.z);
}
float fbm(vec3 p){ float a = 0.5, s = 0.0; for(int i=0;i<3;i++){ s += a*noise(p); p *= 2.03; a *= 0.5; } return s / 0.875; }

// Blackbody colour for a temperature in kelvin (Tanner Helland's fit to the Planck locus, normalised to 0..1).
vec3 kelvin(float K){
  float t = clamp(K, 1000.0, 40000.0) / 100.0;
  vec3 c;
  c.r = t <= 66.0 ? 1.0 : 1.2929362 * pow(t - 60.0, -0.1332048);
  c.g = t <= 66.0 ? 0.3900816 * log(t) - 0.6318414 : 1.1298909 * pow(t - 60.0, -0.0755148);
  c.b = t >= 66.0 ? 1.0 : (t <= 19.0 ? 0.0 : 0.5432068 * log(t - 10.0) - 1.1962541);
  return clamp(c, 0.0, 1.0);
}

// Direction -> deflection angle as a 2D vector (equidistant). Stays finite for light bent backwards.
vec2 deflection(vec3 d){
  float l = length(d.xy);
  return l > 1e-6 ? d.xy / l * acos(clamp(d.z, -1.0, 1.0)) : vec2(0);
}

// ---------- the accretion disk ----------
// Surface brightness of hole i's disk at hp (its own frame, disk in xz, Schwarzschild radii) for light heading
// along rd (same frame). order = how many times this ray has crossed this disk (2+ = light that looped the hole).
vec3 diskB(int i, vec3 hp, vec3 rd, float order){   // brightness, opacity, Doppler factor
  float m = uA[i].w, isco = uE[i].y, outer = uF[i].x, omega = uF[i].w;
  // As the hole loses mass, each ring of gas keeps its angular momentum; a circular orbit with fixed angular
  // momentum sits at r ~ 1/M, so the disk swells outward and thins (surface density ~ M^2).
  float rAct = length(hp.xz);
  float rr = rAct * m;
  if (m <= 0.0 || rr < isco*0.9 || rr > outer * 1.6) return vec3(0, 0, 1);
  float a0 = atan(hp.z, hp.x);
  float b = 0.0, tau = 0.0;
  if (uF[i].z > 0.5 && rr < outer) {
    // Keplerian orbit: angular speed falls off as r^-1.5, so the inner disk laps the outer disk and the gas shears
    // into trailing spirals. Two copies of the pattern restart on a cycle and cross-fade, so it never winds up.
    const float CYCLE = 6.0;
    float w = omega / pow(rr, 1.5);
    float f = fract(uTime / CYCLE);
    float aA = a0 - w * f * CYCLE, aB = a0 - w * fract(f + 0.5) * CYCLE;
    float nA = fbm(vec3(rr*2.2, cos(aA)*2.4, sin(aA)*2.4));
    float nB = fbm(vec3(rr*2.2 + 7.3, cos(aB)*2.4, sin(aB)*2.4));
    float xf = 1.0 - abs(2.0*f - 1.0);
    float n = mix(nB, nA, xf);
    float rings = 0.55 + 0.45*sin(rr*18.0 + n*9.0);
    // Light that looped the hole squeezes the whole disk into a hairline ring; fine detail there only sparkles.
    float soft = clamp(order - 1.0, 0.0, 1.0) * 0.85;
    n = mix(n, 0.5, soft); rings = mix(rings, 0.55, soft);
    n = mix(n, 0.62, 0.6 * uI[i].z); rings = mix(rings, 0.75, 0.5 * uI[i].z);   // groomed: combed smooth
    // Spin moves the inner edge (ISCO) inward, and the inner disk is hotter.
    float profile = smoothstep(isco*0.95, isco*1.15, rr) * min(pow(3.3/rr, 1.8), 3.0) * (1.0 - smoothstep(outer*0.57, outer, rr));
    // Disk styles (unlockable, and they combine).
    float style = 1.0, tstyle = 1.0;
    if (has(i, FX_SPIRAL)) {     // two-armed density wave: a logarithmic spiral turning slowly as a pattern
      float arm = 0.5 + 0.5 * cos(2.0 * (a0 - 0.2 * omega * uTime) + 3.2 * log(rr));
      style *= 0.3 + 1.6 * arm * arm * arm; tstyle *= 0.5 + arm;
    }
    if (has(i, FX_BANDED)) {     // sharp rings with clear gaps, like Saturn's
      float bd = smoothstep(-0.25, 0.25, sin(rr * 5.5 + 0.7));
      style *= 0.08 + 1.4 * bd; tstyle *= 0.04 + bd;
    }
    if (has(i, FX_MAGNETIC)) {   // fine filaments of gas threaded by magnetic field, wound up by the orbit
      float fA = 1.0 - abs(2.0 * noise(vec3(rr * 16.0, cos(aA) * 1.5, sin(aA) * 1.5)) - 1.0);
      float fB = 1.0 - abs(2.0 * noise(vec3(rr * 16.0 + 3.1, cos(aB) * 1.5, sin(aB) * 1.5)) - 1.0);
      float fl = pow(mix(fB, fA, xf), 6.0);
      style *= 0.3 + 2.2 * fl;
    }
    b = profile * (0.35 + 0.65*n*rings) * 2.2 * uD[i].w * (1.0 + 0.6 * uG[i].z) * style;
    if (uI[i].x > 0.0) {   // dreaming: a ghost of the biggest thing it ever ate, wound round the disk with the gas
      float du = fract((a0 - 0.3 * omega / pow(rr, 1.5) * uTime) / 3.14159);
      float dv = clamp((rr - isco * 1.2) / (outer * 0.75 - isco * 1.2), 0.0, 1.0);
      vec3 im = texture(uDream, vec2((float(i) + du) / 4.0, 1.0 - dv)).bgr;
      b += dot(im, vec3(0.3, 0.5, 0.2)) * profile * 2.2 * uI[i].x * uD[i].w;
    }
    tau = profile * 1.6 * tstyle;   // how much the gas blocks light: its smooth density, not its glow
    if (has(i, FX_CLUMPY)) {     // hot spots that orbit with the gas, flare up and fade
      for (int j = 0; j < 6; j++) {
        float fj = float(j);
        float rj = mix(isco * 1.4, outer * 0.5, fract(fj * 0.618 + 0.15));
        float ph = fj * 2.39 + omega / pow(rj, 1.5) * uTime;
        float life = 0.5 - 0.5 * cos(uTime * (0.35 + 0.11 * fj) + fj * 1.7);
        float dd = atan(sin(a0 - ph), cos(a0 - ph));
        b += exp(-((rr - rj) * (rr - rj) / 0.35 + (rr * dd) * (rr * dd) / 0.9)) * 9.0 * life * life * uD[i].w;
      }
    }
    // Fed: a clump of gas falls in along a tightening spiral, then the inner disk flares as it reaches the ISCO.
    float feed = uC[i].y;
    if (feed >= 0.0) {
      float tf = clamp(feed / 1.6, 0.0, 1.0);
      float rf = mix(outer*0.8, isco*1.05, pow(tf, 1.5));
      float af = 1.3 + omega * 0.8 * feed * feed;
      float da = atan(sin(a0 - af), cos(a0 - af));
      float d2 = (rr - rf)*(rr - rf) + (rr*da)*(rr*da)*0.12;
      b += exp(-d2 / 0.5) * 2.5 * (1.0 - smoothstep(1.4, 1.6, feed)) * uD[i].w;
      if (feed > 1.5) b *= 1.0 + 2.5 * exp(-(feed - 1.5)/0.7) * exp(-(rr - isco)/2.5);
      // Light echo: that flare's light reaches the outer disk later (it's further away), lighting a ring running outward.
      if (feed > 1.5) b *= 1.0 + 1.6 * exp(-pow((rr - isco - 7.0 * (feed - 1.5)) / 1.1, 2.0)) * exp(-(feed - 1.5) / 1.4);
    }
  }
  if (has(i, FX_DEBRIS)) {   // what's left of a shredded star: a faint, lumpy ring, its streaks wound into a spiral
    float rd = outer * 1.2, wd = outer * 0.15;
    if (abs(rr - rd) < wd * 2.5) {
      float ad = a0 - omega / pow(rd, 1.5) * uTime * 0.5 + (rr - rd) * 0.9;
      float lump = fbm(vec3(cos(ad) * 3.0, sin(ad) * 3.0, rr * 0.6));
      float ring = exp(-pow((rr - rd) / wd, 2.0));
      b += ring * smoothstep(0.35, 0.8, lump) * 1.5 * uD[i].w;
      tau += ring * smoothstep(0.3, 0.8, lump) * 0.6;
    }
  }
  if (has(i, FX_COMP)) {     // gas pulled off the companion star runs ahead of it, spiralling down into the disk
    float phs = uTime * 6.2832 / 40.0 + float(i) * 2.1, rc = outer * 1.45;
    float u = atan(sin(a0 - phs), cos(a0 - phs));
    if (u > 0.0 && u < 2.6) {
      float rS = mix(rc * 0.96, outer * 0.75, u / 2.6), ws = 0.1 + 0.12 * u;
      b += exp(-pow((rr - rS) / ws, 2.0)) * (1.0 - u / 2.6) * 2.0 * uD[i].w;
      tau += exp(-pow((rr - rS) / ws, 2.0)) * 0.3;
    }
  }
  // Tidal disruption: a star on a near-parabolic orbit comes in, is torn apart at pericentre into a stream (the
  // half that's bound trails inward, the other half is flung out), and the bound gas circularises into a ring that
  // flares and then fades as t^-5/3, the classic tidal-disruption light curve.
  float tt = uG[i].x;
  if (tt >= 0.0) {
    float rp = max(isco * 2.2, 3.5), ap = 2.2, t0 = 1.4;
    if (tt < t0) {
      float s = t0 - tt;
      float rS = rp * (1.0 + 6.0*s*s), aS = ap - 2.6*s / (1.0 + s);
      float dd = atan(sin(a0 - aS), cos(a0 - aS));
      b += exp(-((rr - rS)*(rr - rS) + (rr*dd)*(rr*dd)) / 0.1) * 10.0;
    } else {
      float age = tt - t0;
      float u = atan(sin(a0 - ap - age*1.2), cos(a0 - ap - age*1.2));   // along the stream, from pericentre
      float spread = min(age * 2.0, 3.0);
      float rS = u < 0.0 ? rp * (1.0 - 0.1*u) : rp * (1.0 + 0.8*u*u);
      float w = 0.15 + 0.08*abs(u) + 0.08*age;
      b += (u < 0.0 ? 4.0 : 2.5) * smoothstep(spread, spread*0.6, abs(u)) * exp(-age/2.0) * exp(-pow((rr - rS)/w, 2.0));
      b += 3.0 * exp(-pow((rr - 2.0*rp)/(0.5 + 0.25*age), 2.0)) * smoothstep(0.8, 2.2, age) * pow(max(age, 1.0), -5.0/3.0);
    }
  }
  if (b <= 0.0) return vec3(0, 0, 1);
  // Relativistic beaming: gas orbiting toward us is much brighter than gas moving away.
  vec3 v = normalize(vec3(-hp.z, 0.0, hp.x));
  float beta = min(sqrt(0.5 * m / rAct), 0.95);
  float dop = 1.0 / (inversesqrt(1.0-beta*beta) * (1.0 - beta*dot(v, -rd)));
  b *= uI[i].w > 0.5 ? 1.0 : pow(dop, 3.0);
  b *= sqrt(max(1.0 - m/rAct, 0.0));   // gravitational redshift dims the inner edge
  // Thinning while it evaporates; it also cools, so the tone map reddens it.
  return vec3(vec2(b, max(tau, b * 0.3)) * m * m, dop);
}
// Colour of Doppler-shifted light: gas coming toward you is blueshifted (hotter-looking), gas going away reddened.
vec3 dopTint(float d, float amt){
  if (amt <= 0.0) return vec3(1);
  vec3 tint = clamp(kelvin(5200.0 * d) / max(kelvin(5200.0), vec3(0.05)), 0.0, 3.0);
  return mix(vec3(1), tint, amt * 0.8);
}
// Colour grades for the light (the desktop behind is left alone): natural, filmic, warm, false colour, mono.
vec3 gradeOf(vec3 c, float g){
  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
  if (g < 0.5) return c;
  if (g < 1.5) { vec3 f = c * c * (3.0 - 2.0 * c); return mix(vec3(l), f, 0.85); }
  if (g < 2.5) return mix(c, l * vec3(1.15, 0.82, 0.5) * 1.1, 0.7);
  if (g < 3.5) {   // false colour, like a telescope image: dark purple through red and orange to white
    vec3 a = mix(vec3(0.05, 0.0, 0.15), vec3(0.6, 0.05, 0.35), smoothstep(0.0, 0.3, l));
    a = mix(a, vec3(1.0, 0.45, 0.05), smoothstep(0.25, 0.6, l));
    return mix(a, vec3(1.0, 0.97, 0.85), smoothstep(0.6, 1.0, l));
  }
  return vec3(l);
}

// ---------- relativistic jets ----------
// Plasma shot out along the spin axis at 0.92c. Seen from the side, both beams look alike; tipped toward you, the
// approaching beam is Doppler boosted (brightness ~ D^(2+alpha)) and the receding one fades. Bright knots run outward.
// Light gathered along a step of a ray (d0 to d1, relative to the hole) through the two beams around axis ax.
vec3 jetLight(vec3 d0, vec3 d1, float segL, vec3 ax, vec3 rd, float Rs, float m){
  vec3 u = (d1 - d0) / max(segL, 1e-4);
  vec3 w0 = d0 - ax * dot(d0, ax), uu = u - ax * dot(u, ax);
  float k2 = dot(uu, uu);
  float t = k2 > 1e-6 ? clamp(-dot(w0, uu) / k2, 0.0, segL) : 0.5 * segL;   // closest approach to the axis
  vec3 q = d0 + u * t;
  float z = dot(q, ax), az = abs(z) / Rs;
  if (az < 1.2 || az > 26.0) return vec3(0);
  float rho = length(q - ax * z) / Rs, w = 0.22 + 0.07 * az;   // the beam widens slowly with distance
  float g = exp(-rho * rho / (w * w));
  if (g < 1e-3) return vec3(0);
  float len = min(segL / Rs, 1.77 * w / max(sqrt(k2), 0.08));   // path length through the beam
  float s = sign(z), beta = 0.92, gam = 2.55;
  float boost = pow(1.0 / (1.0 - beta * dot(ax * s, -rd)), 2.6);   // relative to side-on (D * gamma)^(2+alpha)
  float knots = 0.5 + 0.5 * sin(az * 1.2 - uTime * 3.0 + s * 1.7);
  float fade = smoothstep(1.2, 2.5, az) * (1.0 - smoothstep(12.0, 26.0, az));
  return vec3(0.72, 0.84, 1.0) * g * len / w * boost * (0.55 + 0.6 * knots) * fade * 0.55 * m * m;
}

// ---------- exact Kerr light paths ----------
// Kerr-Schild Cartesian coordinates (M = 1, spin along +z), Hamiltonian form:
//   H = 1/2 [ -1 + p.p - f S^2 ],  S = 1 + l.p,  f = 2 r^3 / (r^4 + a^2 z^2),
//   l = ((r x + a y)/(r^2 + a^2), (r y - a x)/(r^2 + a^2), z/r),  r^4 - (R^2 - a^2) r^2 - a^2 z^2 = 0,
//   dx/dl = p - f S l,   dp/dl = 1/2 S^2 grad f + f S (grad l)^T p.
// Unlike Boyer-Lindquist coordinates, nothing goes singular on the spin axis. Checked: Schwarzschild shadow edge
// at 5.1962 M (exact 3*sqrt(3)), spinning-hole shadow edges match Boyer-Lindquist, null condition holds to 1e-8.
float ksDeriv(vec3 x, vec3 p, float a, out vec3 dx, out vec3 dp){
  float R2 = dot(x, x), a2 = a*a;
  float r2 = 0.5*(R2 - a2 + sqrt((R2 - a2)*(R2 - a2) + 4.0*a2*x.z*x.z)), r = sqrt(r2);
  vec3 dr = vec3(r2*x.x, r2*x.y, r2*x.z + a2*x.z) / (r*(2.0*r2 - R2 + a2));
  float D = r2*r2 + a2*x.z*x.z, f = 2.0*r2*r/D;
  vec3 df = (6.0*r2*dr*D - 2.0*r2*r*(4.0*r2*r*dr + vec3(0.0, 0.0, 2.0*a2*x.z))) / (D*D);
  float A = r2 + a2;
  vec3 l = vec3((r*x.x + a*x.y)/A, (r*x.y - a*x.x)/A, x.z/r);

  dx = p - f*S*l;

  const t = clock(), ts = (t / 1000) % 3600;   // wrapped for float precision (the swirl only depends on t mod 6 s)

      || v.h.dance > 0.02 || v.h.purr > 0.02 || v.h.nausea > 0.01 || Math.abs(v.h.park - (v.h.parked ? 1 : 0)) > 0.01 || v.h.walk)
      || meals.length > 0 || nowMs - lastChange < 400 || pendingShot || drag;
  if (!busy && !isShare) {

    if (nowMs - lastDraw < 1000 / 20) return;
  }
  lastDraw = nowMs;
  if (++frames && nowMs - fpsAt >= 1000) { if (isLeader) api.send('stats', { fps: Math.round(frames * 1000 / (nowMs - fpsAt)) }); frames = 0; fpsAt = nowMs; }

  // Which part of this view needs the lens (and so the capture).
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const v of vs) {
    const r = LENS * v.rs + 64;
    x0 = Math.min(x0, v.x - r + v.h.vx * 0.04); y0 = Math.min(y0, v.y - r + v.h.vy * 0.04);
    x1 = Math.max(x1, v.x + r + v.h.vx * 0.04); y1 = Math.max(y1, v.y + r + v.h.vy * 0.04);
  }
  const vw = isShare ? origin.width : canvas.width, vh = isShare ? origin.height : canvas.height;
  if (isShare) { x0 = origin.x; y0 = origin.y; x1 = origin.x + vw; y1 = origin.y + vh; }
  x0 = Math.max(Math.round(x0), origin.x); y0 = Math.max(Math.round(y0), origin.y);
  x1 = Math.min(Math.round(x1), origin.x + vw); y1 = Math.min(Math.round(y1), origin.y + vh);
  lensRect = x1 > x0 && y1 > y0 ? { x: x0, y: y0, w: x1 - x0, h: y1 - y0 } : null;
  if (busy && unchangedRun > 0) unchangedRun = 0;

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  if (!lensRect && !isShare) { prevPos.clear(); if (T) T.histOk = false; if (pendingShot) compositeShot(); return; }

  const gpuQ = gpuBegin();
  // ---- 1. the scene: ray-traced holes (at the render scale) ----
  const k = pxScale, H = canvas.height, kr = k * rscale, Hr = T.H;
  vs.forEach((v, i) => {
    const L = lookOf(v.h), ph = v.h.id * 1.7, md = moodOf(v.h);   // each hole wobbles on its own phase
    UA[0].set([(v.x - origin.x) * kr, Hr - (v.y - origin.y) * kr, v.rs * kr, v.mass], i * 4);
    const hp = (clock() - (v.h.helloAt || 0)) / 1600, hello = hp >= 0 && hp < 1 ? 0.14 * Math.sin(hp * 6.283 * 3) * (1 - hp) : 0;
    UA[1].set([L.tilt + 0.1 * (v.h.yawn || 0) + hello + v.h.tilty * 0.8 + 0.02 * md.wobble * Math.sin(ts * 0.45 + ph), -v.h.tiltx + 0.03 * md.wobble * Math.sin(ts * 0.6 + ph) + 0.07 * (v.h.sway || 0), v.hawkOn, v.burst], i * 4);
    UA[2].set([v.fade, v.feed, v.wave, rsBase(v.h) * kr], i * 4);
    const qz = 0.22 * (v.h.nausea || 0), green = [1.0, 2.6, 0.7];   // queasy: very slightly green
    UA[3].set([...L.coef.map((c, j) => c + (green[j] - c) * qz), L.heat * md.heat * (1 + 1.8 * (v.h.pulse || 0)) * (1 + 0.6 * (v.h.beat || 0) * (v.h.dance || 0))], i * 4);
    const yawn = v.h.yawn || 0;   // yawning: the disk stretches out and puffs up for a moment
    UA[4].set([L.spin, L.isco, L.horizon, L.thickness + 0.08 * yawn], i * 4);
    UA[5].set([L.on ? L.outer * (1 + 0.18 * yawn) : 0, L.alpha, L.on, L.omega * md.omega], i * 4);

    UA[9].set([v.h.align || 0, corona, L.castShadow ? 1 : 0, 0], i * 4);
    UA[8].set([v.h.dream || 0, Math.min(1, 0.12 + 1.5 * (v.h.accr || 0) + (v.h.wind || 0)), v.h.groom || 0, /^gargantua$/i.test((v.h.name || '').trim()) ? 1 : 0], i * 4);
    const retroLv = Math.max(L.retroSkin ? 1 : 0, Math.min((v.h.retro || 0) * 4, 1) * Math.min((30 - (v.h.retro || 0)) * 8 + 0.0001, 1) * (v.h.retro > 0 ? 1 : 0));

  let sx0 = Infinity, sy0 = Infinity, sx1 = -Infinity, sy1 = -Infinity;
  const grow = (x0, y0, x1, y1) => { sx0 = Math.min(sx0, x0); sy0 = Math.min(sy0, y0); sx1 = Math.max(sx1, x1); sy1 = Math.max(sy1, y1); };

  gl.bindFramebuffer(gl.FRAMEBUFFER, T.scene);

  const S = P.scene;
  gl.uniform1i(S.u('uScreen'), 0);
  gl.uniform1i(S.u('uMeal'), 1);
  gl.uniform1i(S.u('uHasMeal'), hasMeal ? 1 : 0);
  gl.uniform1i(S.u('uN'), vs.length);
  ['uA', 'uB', 'uC', 'uD', 'uE', 'uF', 'uG', 'uH', 'uI', 'uJ'].forEach((n, i) => gl.uniform4fv(S.u(n), UA[i]));

  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, dreamTex);

  gl.uniform2f(S.u('uWinOrigin'), origin.x, origin.y);
  gl.uniform2f(S.u('uCapOrigin'), capRect.x, capRect.y);
  gl.uniform2f(S.u('uCapSize'), capRect.w, capRect.h);
  gl.uniform1i(S.u('uHasScreen'), hasScreen ? 1 : 0);

  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.bindFramebuffer(gl.FRAMEBUFFER, T.fhist[histOut]);

  gl.useProgram(P.taa);

    gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
    const pass = (prog, fbo, w, h, src, setup) => {

    for (const [fa, ta, fb, tb, w, h] of [[T.fa2, T.a2, T.fa1, T.a1, T.w4, T.h4]]) {
      pass(P.blur, fa, w, h, T.a1, () => { gl.uniform2f(P.blur.u('uDir'), 1, 0); gl.uniform2f(P.blur.u('uSize'), w, h); });
      pass(P.blur, fb, w, h, ta, () => { gl.uniform2f(P.blur.u('uDir'), 0, 1); gl.uniform2f(P.blur.u('uSize'), w, h); });
    }
    pass(P.copy, T.fb1, T.w8, T.h8, T.a1, () => gl.uniform2f(P.copy.u('uTexel'), 1 / T.w8, 1 / T.h8));
    pass(P.blur, T.fb2, T.w8, T.h8, T.b1, () => { gl.uniform2f(P.blur.u('uDir'), 1, 0); gl.uniform2f(P.blur.u('uSize'), T.w8, T.h8); });
    pass(P.blur, T.fb1, T.w8, T.h8, T.b2, () => { gl.uniform2f(P.blur.u('uDir'), 0, 1); gl.uniform2f(P.blur.u('uSize'), T.w8, T.h8); });

  // ---- 4. composite to the window: scene + motion blur + bloom (+ the desktop, in the share view) ----
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(P.comp);
  const C = P.comp;
  [[T.hist[T.histAt], 'uScene'], [T.a1, 'uBloomA'], [T.b1, 'uBloomB'], [screenTex, 'uScreen'], [T.meal, 'uMeal']].forEach(([tex, n], i) => {
    gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(C.u(n), i);
  });
  gl.uniform1i(C.u('uHasMeal'), hasMeal ? 1 : 0);
  vs.forEach((v, i) => {
    const pp = prevPos.get(v.h.id) || { x: v.x, y: v.y };
    // Velocity over the frame, scaled to a camera's typical half-frame exposure; only when it's really moving.
    const mvx = settings.motionBlur ? (v.x - pp.x) * k * 0.5 : 0, mvy = settings.motionBlur ? -(v.y - pp.y) * k * 0.5 : 0;
    MB.set([(v.x - origin.x) * k, H - (v.y - origin.y) * k, mvx, mvy], i * 4);
    MR.set([LENS * v.rs * k, 0, 0, 0], i * 4);
  });
  prevPos.clear(); for (const v of vs) prevPos.set(v.h.id, { x: v.x, y: v.y });
  gl.uniform1i(C.u('uN'), vs.length);
  gl.uniform4fv(C.u('uMB'), MB); gl.uniform4fv(C.u('uMR'), MR);
  gl.uniform2f(C.u('uRes'), canvas.width, canvas.height);
  gl.uniform1f(C.u('uBloomAmt'), bloomAmt * (floatTargets ? 1 : 4));
  gl.uniform1i(C.u('uShare'), isShare ? 1 : 0);
  gl.uniform2f(C.u('uWinOrigin'), origin.x, origin.y);
  gl.uniform2f(C.u('uCapOrigin'), capRect.x, capRect.y);
  gl.uniform2f(C.u('uCapSize'), capRect.w, capRect.h);
  gl.uniform1f(C.u('uPxScale'), k);

    gl.enable(gl.SCISSOR_TEST);
    gl.scissor(Math.max(0, Math.floor(c0[0] - pad)), Math.max(0, Math.floor(c0[1] - pad)), Math.ceil(c0[2] + 2 * pad), Math.ceil(c0[3] + 2 * pad));

  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.disable(gl.SCISSOR_TEST);
  adaptQuality(nowMs);
  gl.activeTexture(gl.TEXTURE0);

  if (pendingShot) compositeShot();
}

  flatBg = query.get('icon') === 'white' ? [1, 1, 1] : [0, 0, 0];

               tilt: +query.get('tilt') || 7, spinSpeed: 0, bhSpin: 0.7, bloom: 0, motionBlur: false, einsteinStar: false,

  // (portraits and share cards: the hole's whole look, as it is on the desktop)
  for (const k of ['look', 'diskColor', 'diskTemp', 'thickness', 'retroSkin', 'fx', 'bloom', 'grade', 'dopplerColor', 'einsteinStar']) if (k in pet) settings[k] = pet[k];

  addEventListener('message', e => {

    for (const k of ['look', 'diskColor', 'diskTemp', 'thickness', 'retroSkin', 'fx', 'bloom', 'grade', 'dopplerColor', 'einsteinStar', 'tilt', 'spinSpeed', 'castShadow'])
      if (k in p && (typeof p[k] === typeof settings[k] || settings[k] === undefined)) settings[k] = p[k];
    const g = holes[0];
    if (g) { if (Number.isFinite(p.spin)) g.spin = p.spin; g.rare = typeof p.rare === 'string' ? p.rare : null; g.name = typeof p.name === 'string' ? p.name : ''; }
  });

    const W = Math.max(64, Math.round(innerWidth * devicePixelRatio)), Hh = Math.max(64, Math.round(innerHeight * devicePixelRatio));
    const cv = Object.assign(document.createElement('canvas'), { width: W, height: Hh }), c2 = cv.getContext('2d');
    const gr = c2.createLinearGradient(0, 0, W, Hh); gr.addColorStop(0, '#141a2c'); gr.addColorStop(1, '#0b0d14');
    c2.fillStyle = gr; c2.fillRect(0, 0, W, Hh);

    for (let g = 0; g <= Hh; g += Hh / 12) { c2.beginPath(); c2.moveTo(0, g); c2.lineTo(W, g); c2.stroke(); }
    const px = c2.getImageData(0, 0, W, Hh).data;

    const gr = c2.createLinearGradient(0, 0, 320, 180); gr.addColorStop(0, '#3a6ea5'); gr.addColorStop(1, '#a5537a');
    c2.fillStyle = gr; c2.fillRect(0, 0, 320, 180);
    for (const [x, y, w, hh, c] of [[30, 25, 150, 100, '#f3f3f3'], [150, 60, 140, 95, '#202020'], [40, 140, 240, 18, '#1b1b1b']]) {
      c2.fillStyle = c; c2.fillRect(x, y, w, hh); c2.fillStyle = '#0078d4'; c2.fillRect(x, y, w, 8);

    const px = c2.getImageData(0, 0, 320, 180).data;

  api.send = () => {};
  ready = true;
}
// Particles around a hole, drawn on a 2D layer above the ray-traced picture: a dust trail when it moves, and
// snow (December to February) or embers (the rest of the year) drifting in and spiralling down into it.
const fx2d = document.getElementById('fx2d'), fxc = fx2d.getContext('2d');
const parts = [], hicSeen = new Map();
let partsAt = 0, partsDrawn = false;
const winter = () => [10, 11, 0, 1].includes(new Date().getMonth());   // November to February
// (warm: step without drawing, so a preview starts with particles already in flight)
function particles(vs, t, warm = 0) {
  const dt = warm || Math.min((t - (partsAt || t)) / 1000, 0.05);
  if (!warm) partsAt = t;
  if (isShare) return;
  if (fx2d.width !== canvas.width || fx2d.height !== canvas.height) { fx2d.width = canvas.width; fx2d.height = canvas.height; }
  for (const v of vs) {
    if (v.h.deathAt) continue;
    const bits = lookOf(v.h).fxBits, R = 2.6 * v.rs;
    if (bits & FXB.dust) {
      const vx = previewDemo ? 420 : v.h.vx, vy = previewDemo ? -60 : v.h.vy, sp = Math.hypot(vx, vy);
      for (let n = Math.random() < sp * dt / 6 ? Math.ceil(sp * dt / 6) : 0; n > 0 && parts.length < 600; n--) {
        // shed from the trailing side, drifting back along the path it came
        const ux = vx / sp, uy = vy / sp, side = (Math.random() - 0.5) * R * 1.6, back = R * (0.8 + 0.6 * Math.random());
        parts.push({ kind: 'dust', x: v.x - ux * back - uy * side, y: v.y - uy * back + ux * side * 0.5, vx: -vx * 0.3 + (Math.random() - 0.5) * 30,
                     vy: -vy * 0.3 + (Math.random() - 0.5) * 30, life: 0, max: 1.2 + Math.random(), size: R * (0.25 + 0.3 * Math.random()), hole: v.h.id });
      }
    }
    if ((v.h.wind || 0) > 0.05 && parts.length < 600) {   // Eddington wind: gas blown outward off the disk
      for (let n = Math.random() < dt * 90 * v.h.wind ? 2 : 0; n > 0; n--) {
        const a = Math.random() * 6.283, sp = 160 + 140 * Math.random();
        parts.push({ kind: 'wind', x: v.x + Math.cos(a) * R * 1.1, y: v.y + Math.sin(a) * R * 0.5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.6,
                     life: 0, max: 1.4, size: 1.5 + Math.random() * 1.5, hole: v.h.id, seed: Math.random() * 9 });
      }
    }
    if (v.h.hicAt && v.h.hicAt !== hicSeen.get(v.h.id)) {   // a hiccup: a little puff
      hicSeen.set(v.h.id, v.h.hicAt);
      for (let n = 0; n < 7; n++) {
        const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.6, sp = 60 + 80 * Math.random();
        parts.push({ kind: 'dust', x: v.x, y: v.y - R * 0.6, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max: 0.9, size: R * 0.25, hole: v.h.id });
      }
    }
    if (bits & FXB.snow && Math.random() < dt * (previewDemo ? 40 : 7) && parts.length < 600) {
      const a = Math.random() * 6.283, r = R * (4 + 5 * Math.random());
      parts.push({ kind: winter() ? 'snow' : 'ember', x: v.x + Math.cos(a) * r, y: v.y + Math.sin(a) * r, vx: -Math.sin(a) * 40, vy: Math.cos(a) * 40,
                   life: 0, max: 14, size: (winter() ? 1.6 : 1.2) + Math.random() * 1.6, hole: v.h.id, seed: Math.random() * 9 });
    }
  }
  if (!parts.length && !warm) { if (partsDrawn) { fxc.clearRect(0, 0, fx2d.width, fx2d.height); partsDrawn = false; } return; }
  if (!warm) { fxc.clearRect(0, 0, fx2d.width, fx2d.height); fxc.globalCompositeOperation = 'lighter'; }
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i], v = vs.find(v => v.h.id === q.hole);
    q.life += dt;
    if (q.kind === 'wind') { q.vx *= 1 - 0.4 * dt; q.vy *= 1 - 0.4 * dt; }
    else if (q.kind !== 'dust' && v) {   // falls inward, swirling the way the disk turns, faster as it gets close
      const dx = v.x - q.x, dy = v.y - q.y, d = Math.hypot(dx, dy) || 1, R = 2.6 * v.rs;
      const g = 9e5 * (v.rs / 21) / Math.max(d, R) ** 1.4;
      q.vx += (dx / d * g + dy / d * g * 0.6 + Math.sin(q.life * 2 + q.seed) * 8) * dt;
      q.vy += (dy / d * g - dx / d * g * 0.6 + (q.kind === 'snow' ? 12 : -10)) * dt;
      q.vx *= 1 - 0.6 * dt; q.vy *= 1 - 0.6 * dt;
      if (d < R * 1.05) q.life = q.max;   // gone over the edge
    } else { q.vx *= 1 - 1.5 * dt; q.vy *= 1 - 1.5 * dt; }
    q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.life >= q.max || !v) { parts.splice(i, 1); continue; }
    if (warm) continue;
    const x = (q.x - origin.x) * pxScale, y = (q.y - origin.y) * pxScale, f = q.life / q.max;
    if (q.kind === 'dust') {
      const a = 0.07 * (1 - f) * Math.min(1, q.life * 6), s = q.size * (1 + f * 2.5);
      const gr = fxc.createRadialGradient(x, y, 0, x, y, s);
      gr.addColorStop(0, `rgba(220,170,140,${a})`); gr.addColorStop(1, 'rgba(200,130,100,0)');
      fxc.fillStyle = gr; fxc.fillRect(x - s, y - s, s * 2, s * 2);
    } else {
      const a = Math.min(1, q.life * 2) * (1 - f * f) * (q.kind === 'snow' ? 0.75 : 0.6 + 0.4 * Math.sin(q.life * 9 + q.seed));
      fxc.fillStyle = q.kind === 'wind' ? `rgba(200,220,255,${a * 0.8})` : q.kind === 'snow' ? `rgba(235,242,255,${a})` : `rgba(255,${120 + 60 * Math.sin(q.seed)},40,${a})`;
      fxc.beginPath(); fxc.arc(x, y, q.size * (q.kind === 'ember' ? 0.8 : 1), 0, 6.283); fxc.fill();
    }
  }
  fxc.globalCompositeOperation = 'source-over';
  partsDrawn = true;
}

// The path you're drawing (and, after, fading), and the "event horizon" darkening of the whole screen.
const ui2d = document.getElementById('ui2d'), uic = ui2d.getContext('2d');
let pathFade = null, horizonAt = -1e9, uiDrawn = false;
api.on('horizon', () => { horizonAt = performance.now(); });
// Light paths in the hole's equatorial plane (Schwarzschild: u'' + u = 3/2 u^2, u = Rs/r), for a fan of impact parameters,
// in units of Rs. Worked out once; each frame they're just drawn, scaled and placed.
const BLUEPRINT = (() => {
  const paths = [];
  for (let b = -8; b <= 8.01; b += 1) {
    if (Math.abs(b) < 0.3) continue;
    let u = 1e-4, du = 1 / Math.abs(b), phi = 0;   // coming in from far away on the left
    const pts = [], dphi = 0.01;
    for (let k = 0; k < 2400; k++) {
      const r = 1 / u, x = -r * Math.cos(phi), y = r * Math.sin(phi) * Math.sign(b);
      if (k % 4 === 0) pts.push([x, y]);
      if (u >= 1 || r > 30 && k > 50 && du < 0) break;   // fell in, or left
      const a = -u + 1.5 * u * u;
      du += a * dphi; u += du * dphi; phi += dphi;
      if (u <= 0) break;
    }
    paths.push({ pts, captured: u >= 1 });
  }
  return paths;
})();
function drawBlueprint(vs) {
  for (const v of vs) {
    if (v.h.deathAt) continue;
    const cx = (v.x - origin.x) * pxScale, cy = (v.y - origin.y) * pxScale, R = v.rs * pxScale, L = 11 * R;
    uic.save();
    uic.beginPath(); uic.arc(cx, cy, L, 0, 6.283); uic.clip();
    uic.fillStyle = 'rgba(8,28,70,0.55)'; uic.fillRect(cx - L, cy - L, L * 2, L * 2);
    uic.strokeStyle = 'rgba(120,180,255,0.14)'; uic.lineWidth = 1;
    for (let g = -LENS; g <= LENS; g += 2) { uic.beginPath(); uic.moveTo(cx + g * R, cy - L); uic.lineTo(cx + g * R, cy + L); uic.moveTo(cx - L, cy + g * R); uic.lineTo(cx + L, cy + g * R); uic.stroke(); }
    uic.lineWidth = Math.max(1, dpr);
    for (const p of BLUEPRINT) {
      uic.strokeStyle = p.captured ? 'rgba(255,150,120,0.55)' : 'rgba(150,215,255,0.6)';
      uic.beginPath();
      p.pts.forEach(([x, y], i) => (i ? uic.lineTo : uic.moveTo).call(uic, cx + x * R, cy - y * R));
      uic.stroke();
    }
    const label = (r, text, dash, ang) => {
      uic.setLineDash(dash); uic.strokeStyle = 'rgba(220,235,255,0.85)';
      uic.beginPath(); uic.arc(cx, cy, r * R, 0, 6.283); uic.stroke(); uic.setLineDash([]);
      uic.fillStyle = 'rgba(220,235,255,0.9)'; uic.font = `${11 * dpr}px "Segoe UI", sans-serif`;
      uic.beginPath(); uic.moveTo(cx + Math.cos(ang) * r * R, cy - Math.sin(ang) * r * R); uic.lineTo(cx + Math.cos(ang) * 6.5 * R, cy - Math.sin(ang) * 6.5 * R); uic.stroke();
      uic.fillText(text, cx + Math.cos(ang) * 6.5 * R + (Math.cos(ang) < 0 ? -uic.measureText(text).width - 4 * dpr : 4 * dpr), cy - Math.sin(ang) * 6.5 * R + 4 * dpr);
    };
    label(1, 'horizon', [], 2.6);
    label(1.5, 'photon sphere', [4 * dpr, 4 * dpr], 0.55);
    label(2.6, 'shadow edge', [1 * dpr, 4 * dpr], -0.55);
    label(3, 'innermost stable orbit', [8 * dpr, 5 * dpr], -2.6);
    uic.restore();
  }
}
function uiLayer() {
  const now = performance.now(), hz = (now - horizonAt) / 1000, pts = drawing?.pts || (pathFade && now - pathFade.at < 2500 ? pathFade.pts : null);
  const bp = settings?.blueprint && !isShare;
  if (!pts && hz > 3.2 && !bp) { if (uiDrawn) { uic.clearRect(0, 0, ui2d.width, ui2d.height); uiDrawn = false; } return; }
  if (ui2d.width !== canvas.width || ui2d.height !== canvas.height) { ui2d.width = canvas.width; ui2d.height = canvas.height; }
  uic.clearRect(0, 0, ui2d.width, ui2d.height);
  uiDrawn = true;
  if (bp) drawBlueprint(views(clock()).filter(v => v.fade > 0));
  if (pts) {
    const a = drawing ? 0.85 : 0.85 * (1 - (now - pathFade.at) / 2500);
    uic.lineWidth = 3 * dpr; uic.lineCap = uic.lineJoin = 'round';
    uic.setLineDash([2 * dpr, 9 * dpr]);
    uic.strokeStyle = `rgba(255,190,140,${a})`;
    uic.beginPath();
    pts.forEach((p, i) => (i ? uic.lineTo : uic.moveTo).call(uic, (p[0] - origin.x) * pxScale, (p[1] - origin.y) * pxScale));
    uic.stroke(); uic.setLineDash([]);
  }
  if (hz <= 3.2) {   // typed "event horizon": the edges of the screen darken, as if everything's falling in, then clear
    const k = hz < 0.6 ? hz / 0.6 : hz < 1.4 ? 1 : Math.max(0, 1 - (hz - 1.4) / 1.8);
    const W = ui2d.width, H = ui2d.height, g = uic.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.hypot(W, H) / 2);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${0.92 * k})`);
    uic.fillStyle = g; uic.fillRect(0, 0, W, H);
  }
}

// Hover a hole for a moment: how it's feeling, in a small tag beside it.
const GLYPH = { floating: '☄', scared: '!', jealous: '◑', sulking: '︶', hiccups: '∘', hungry: '◔', sleepy: '☾', excited: '✦', content: '♡', purring: '♡', dancing: '♪', bored: '…', queasy: '≈', quiet: '·', parked: '‖', calm: '·' };
let tagFor = -1, tagSince = 0, overTag = false;
function moodTag(vs, t) {
  const el = document.getElementById('moodtag');
  const v = (over >= 0 || overTag) && !myDrag ? vs.find(v => v.h.id === (overTag ? tagFor : over) && !v.h.deathAt) : null;
  if (!v) { tagFor = -1; el.classList.remove('on'); return; }
  if (tagFor !== over) { tagFor = over; tagSince = t; }
  if (t - tagSince < 600) return;
  const mood = v.h.mood || 'calm', R = 2.6 * v.rs / dpr;
  const name = v.h.name || 'Black hole', text = `${name} ${GLYPH[mood] || '·'} ${mood}`;
  if (el.dataset.text !== text) {
    el.dataset.text = text; el.innerHTML = '';
    const n = document.createElement('span'); n.className = 'nm'; n.textContent = name; n.title = 'Rename';
    const b = document.createElement('b'); b.textContent = GLYPH[mood] || '·';
    el.append(n, b, mood);
  }
  el.style.left = Math.min((v.x - origin.x) / dpr + R * 1.25, innerWidth - el.offsetWidth - 8) + 'px';
  el.style.top = Math.max((v.y - origin.y) / dpr - R * 1.15, 8) + 'px';
  el.classList.add('on');
}

// Music playing on the PC (any app): the hole dances to it. The PC's sound output is analysed here, live, for loudness
// and bass hits; nothing is recorded or kept. Off with Settings -> Sound -> "Dance to music on the PC".
const listen = (() => {
  let ac = null, an = null, buf = null, stream = null, starting = false, failedAt = 0;
  let avg = 0, on = 0, lastBeat = 0, prev = null, acc = 0, flux = 0, lvl = 0;
  const beats = [];
  async function start() {
    if (starting || clock() - failedAt < 60000) return;
    starting = true;
    try {
      let s;
      try { s = await navigator.mediaDevices.getDisplayMedia({ audio: true, video: { width: 16, height: 16, frameRate: 1 } }); }
      catch { s = await navigator.mediaDevices.getUserMedia({ audio: { mandatory: { chromeMediaSource: 'desktop' } }, video: { mandatory: { chromeMediaSource: 'desktop', maxWidth: 16, maxHeight: 16, maxFrameRate: 1 } } }); }
      for (const tr of s.getVideoTracks()) tr.stop();
      if (!s.getAudioTracks().length) throw new Error('no audio track');
      stream = s; ac = new AudioContext();
      an = ac.createAnalyser(); an.fftSize = 1024; an.smoothingTimeConstant = 0;
      ac.createMediaStreamSource(s).connect(an);
      buf = new Float32Array(an.frequencyBinCount);
      api.send('log', 'info', 'listening to the PC\'s sound for music');
    } catch (e) { failedAt = clock(); api.send('log', 'warn', `can't hear the PC's sound: ${e.message}`); }
    starting = false;
  }
  function stop() { stream?.getTracks().forEach(tr => tr.stop()); ac?.close(); ac = an = stream = null; on = 0; }
  return {
    sample(enabled, dt) {
      if (!enabled) { if (an) stop(); return { on: 0, beat: false }; }
      if (!an) { start(); return { on: 0, beat: false }; }
      // Onsets (snares, hats, the click of a kick, voices) by spectral flux: how much the 200 Hz - 4 kHz bands suddenly
      // got louder, compared with its recent average. Below 200 Hz is left out: that's where our own hum and purr are.
      // Sampled at a steady 50 times a second.
      acc += dt;
      if (acc < 0.02) return { on, beat: false };
      const step = acc; acc = 0;
      an.getFloatFrequencyData(buf);   // dB per band
      const hz = ac.sampleRate / an.fftSize, top = Math.min(buf.length, Math.ceil(4000 / hz));
      prev ||= new Float32Array(buf.length);
      let all = 0; flux = 0;
      for (let i = Math.ceil(200 / hz); i < top; i++) {
        const m = buf[i] > -160 ? Math.pow(10, buf[i] / 20) : 0;   // amplitude
        all += m * m;
        if (m > prev[i]) flux += m - prev[i];
        prev[i] = m;
      }
      const t = clock() / 1000;
      // Loud enough to be music (the PC's idle noise floor is about 1e-6), and not one of our own gulps or chirps.
      lvl = Math.max(all, lvl * Math.exp(-step / 0.7));
      const beat = flux > avg * 1.8 && lvl > 1e-4 && t - lastBeat > 0.25 && clock() > ownSoundUntil;
      avg += (flux - avg) * Math.min(1, step / 0.6);
      if (beat) { lastBeat = t; beats.push(t); }
      while (beats.length && t - beats[0] > 4) beats.shift();
      const playing = beats.length >= 4 && lvl > 1e-4;   // a steady run of hits, not one notification ding
      on += ((playing ? 1 : 0) - on) * Math.min(1, step / (playing ? 1.5 : 3));
      this.last = { flux, avg, all, lvl, beats: beats.length };   // for checking what it hears
      return { on, beat };
    },
  };
})();

api.on('init', init => {
  settings = init.settings; displays = init.displays; Object.assign(origin, init.origin);
  document.body.classList.toggle('large', !!settings.largeLabels);
  if (init.boredAfter) boredAfter = init.boredAfter;
  isLeader = init.leader; isShare = !!init.share; paused = !!init.paused;
  if (isShare) pxScale = canvas.width / origin.width;
  if (isLeader) { adopt(init.state); if (!holes.length) spawnFirst(); }
  else if (init.state) { holes = init.state.holes; stamp = init.state.t; }
  ready = true;
});
api.on('role', (leader, state) => {
  if (!ready || isShare) return;   // 'init' (still on its way) carries the role too
  if (leader && !isLeader) { adopt(state); if (!holes.length && !hadHoles) spawnFirst(); }
  isLeader = leader;
});
api.on('state', s => { if (!isLeader) { holes = s.holes; stamp = s.t; } });
api.on('input', m => { if (isLeader) onInput(m); });
api.on('displays', d => { displays = d; });
api.on('origin', o => { if (!isShare) Object.assign(origin, o); });
api.on('settings', s => {
  document.body.classList.toggle('large', !!s.largeLabels);
  if (isLeader && settings && s.bhSpin !== settings.bhSpin) for (const h of holes) if (h.overrides?.bhSpin == null) h.spin = +s.bhSpin;
  settings = s; lastDraw = 0;
  if ((s.quality || 'auto') !== 'auto') slowFrames = fastFrames = 0;
});
api.on('paused', p => { paused = p; });
addEventListener('resize', () => { if (isShare && origin.width) pxScale = canvas.width / origin.width; });
addEventListener('error', e => api.send('log', 'error', `${e.message} (${e.filename}:${e.lineno})`));
requestCapture();
requestAnimationFrame(frame);
</script>
</body>
